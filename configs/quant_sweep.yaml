# Phase 2: post-training quantization sweep over the Phase 1 models (notes/LOG.md, "Phase 2 plan").
experiment: quant_sweep
settings:
  A: {run: results/rep_5in2/20261024-062922, S_values: null}      # null = every S in the run
  B: {run: results/rep_20in5/20261024-063030, S_values: null}
  C: {run: results/rep_dims/20261024-063236, S_values: [0.0, 0.6019, 0.7488, 0.8415, 0.9, 0.9602, 0.9749, 0.99]}
  # Phase 3 confirmation set (fresh seed 1, 10 instances per S); sealed until the pre-registration is approved.
  C_confirm: {run: results/rep_dims_confirm/20261024-130737, S_values: null}
  # Phase 3b second fresh set (seed 7, 20 instances at S = 0.7488); run path filled after training
  C_confirm2: {run_glob: results/rep_dims_confirm2/*, S_values: null}
bits: [8, 6, 5, 4, 3, 2]
granularities: [tensor, column, row]
noise_seeds: 5
ablations: [quant_b, enc_only, dec_only]
ablation_granularities: [column, row]
eval:
  n_active: 2000
  n_inactive: 20000
  n_nat_min: 40000
  n_nat_max: 120000
  tau: 0.05
  near_eps: 0.05
  seed_base: 10000
  survival_threshold: 0.9
  composite_dr2: 0.1
  composite_dfalse: 0.05
  eligible_r2: 0.5
sanity:
  bits8_median_abs_dR2_max: 0.01
  bits8_loss_increase_rel_max: 0.01
