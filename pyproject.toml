[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmsq"
version = "0.1.0"
description = "Toy Models of Superposition x post-training quantization (TMS-Q)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/tmsq/phase3.py" = ["E501"]
"src/tmsq/plots_phase3.py" = ["E501"]
"src/tmsq/experiments/phase3.py" = ["E501"]
"tests/test_phase3.py" = ["E501"]
